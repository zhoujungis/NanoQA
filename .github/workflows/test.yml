name: 全量测试

on:
  push:
    branches: [main]

jobs:
  backend-test:
    name: 后端全量测试（Django）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nanoqa
          POSTGRES_DB: nanoqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: nanoqa
      DB_NAME: nanoqa
      DB_TEST_NAME: nanoqa_test_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 全量后端测试
        working-directory: backend
        run: python manage.py test apps --verbosity=1

  frontend-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查与构建（vue-tsc + vite build）
        working-directory: frontend
        run: npm run build
